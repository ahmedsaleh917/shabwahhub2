<script>
// اعتراض الأخطاء وعرضها
window.onerror = function(msg, url, line, col, error) {
  const errorDiv = document.createElement('div');
  errorDiv.style.cssText = `
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    background: #f00;
    color: #fff;
    padding: 15px;
    font-size: 14px;
    z-index: 99999;
    font-family: monospace;
  `;
  errorDiv.innerHTML = `
    <strong>❌ خطأ في JavaScript:</strong><br>
    ${msg}<br>
    <small>السطر: ${line}</small>
  `;
  document.body.appendChild(errorDiv);
  return false;
};
</script>

  <!-- 🎨 شبوة HUB - الجافاسكريبت الأساسي -->
  <script>
    // 🎯 تبديل تبويبات التنقل السفلي
    function switchTab(pageName, btn) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      document.querySelectorAll('.nav-icon').forEach(icon => {
        icon.classList.remove('active');
      });
      btn.querySelector('.nav-icon')?.classList.add('active');
      
      document.querySelectorAll('.feed-container').forEach(c => {
        c.classList.remove('active');
        c.classList.add('hidden');
      });
      
      const target = document.getElementById(`${pageName}-container`);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('active');
      }
      
      console.log('📄 Page loaded:', pageName);
    }
    
    // ❤️ تفاعل زر الإعجاب
    function handleLikeClick(btn, postId, postOwnerId) {
      const icon = btn.querySelector('.sh-icon-like');      const countEl = document.getElementById(`likes-${postId}`);
      
      if (!icon || !countEl) return;
      
      const isLiked = icon.classList.contains('liked');
      let count = parseInt(countEl.textContent) || 0;
      
      if (isLiked) {
        icon.classList.remove('liked');
        countEl.textContent = Math.max(0, count - 1);
      } else {
        icon.classList.add('liked');
        countEl.textContent = count + 1;
      }
    }
    
    // 🔖 تبديل الحفظ
    function toggleBookmark(btn, postId) {
      const icon = btn.querySelector('.sh-icon-bookmark');
      if (icon) {
        icon.classList.toggle('saved');
      }
    }
    
    // 💬 تبديل عرض التعليقات
    function toggleComments(postId) {
      const section = document.getElementById(`comments-${postId}`);
      if (section) {
        section.classList.toggle('show');
      }
    }
    
    // 🔔 تحديث شارة الإشعارات
    function updateNotificationBadge(count) {
      const badges = document.querySelectorAll('#notifications-badge, #nav-notif-badge');
      const icons = document.querySelectorAll('#notif-icon, #nav-notif-icon');
      
      badges.forEach(badge => {
        if (count > 0) {
          badge.textContent = count > 99 ? '99+' : count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      });
      
      icons.forEach(icon => {
        const svg = icon.closest('.sh-icon') || icon;
        if (count > 0 && !svg.querySelector('.icon-badge')) {
          const badge = document.createElement('span');          badge.className = 'icon-badge';
          badge.textContent = count > 99 ? '99+' : count;
          svg.style.position = 'relative';
          svg.appendChild(badge);
        } else if (count === 0) {
          const oldBadge = svg.querySelector('.icon-badge');
          if (oldBadge) oldBadge.remove();
        }
      });
    }
    
    // 📝 فتح نموذج النشر
    function openPostModal() {
      const modal = document.getElementById('create-post-modal');
      if (modal) {
        modal.classList.remove('hidden');
        document.getElementById('post-content')?.focus();
      }
    }
    
    // ❌ إغلاق المودال
    document.getElementById('close-post-modal')?.addEventListener('click', () => {
      document.getElementById('create-post-modal')?.classList.add('hidden');
      document.getElementById('post-content').value = '';
      document.getElementById('char-count').textContent = '0';
    });
    
    // 🔢 عدّاد أحرف المنشور
    document.getElementById('post-content')?.addEventListener('input', (e) => {
      document.getElementById('char-count').textContent = e.target.value.length;
    });
    
    // 🚪 الخروج المزدوج (لأندرويد)
    let lastBackPress = 0;
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Back' || e.keyCode === 27) {
        const now = Date.now();
        const currentPage = document.querySelector('.feed-container.active')?.id.replace('-container', '');
        
        if (currentPage === 'feed') {
          if (now - lastBackPress < 2000) {
            if (window.AndroidInterface) {
              window.AndroidInterface.exitApp();
            }
          } else {
            showToast('اضغط مرة أخرى للخروج', 'info', 2000);
            lastBackPress = now;
          }
          e.preventDefault();
        } else {          switchTab('feed', document.querySelector('.nav-btn[data-page="feed"]'));
          e.preventDefault();
        }
      }
    });
    
    // 🍞 عرض رسالة منبثقة
    function showToast(message, type = 'info', duration = 3000) {
      let toast = document.getElementById('global-toast');
      if (!toast) {
        toast = document.createElement('div');
        toast.id = 'global-toast';
        toast.className = 'toast';
        document.body.appendChild(toast);
      }
      toast.textContent = message;
      toast.className = `toast ${type} show`;
      setTimeout(() => toast.classList.remove('show'), duration);
    }
    
    // 🔐 تحميل لوحة الأدمن
    function loadAdminPanel() {
      window.location.href = 'admin.html';
    }
    
    // 🔄 تبديل تبويبات المحتوى الرائج
    function switchFeedTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.currentTarget.classList.add('active');
      showToast(`جاري تحميل: ${tabName === 'trending' ? 'الرائج' : 'المتابعين'}...`, 'info');
    }
    
    // 📄 تحميل صفحة
    function loadPage(pageName) {
      switchTab(pageName, document.querySelector(`.nav-btn[data-page="${pageName}"]`));
    }
    
    // 🔔 تحديد الكل كمقروء
    function markAllAsRead() {
      updateNotificationBadge(0);
      showToast('تم تحديد الكل كمقروء ✓', 'success');
    }
    
    // 🧪 تجربة: تحديث شارة الإشعارات بعد 3 ثواني
    setTimeout(() => {
      updateNotificationBadge(3);
    }, 3000);
    
    console.log('✅ ShabwaHub Frontend Loaded with SVG Icons 🎨✨');
  </script>

  <!-- 🐛 نظام فحص الأخطاء للموبايل -->
<div id="debug-panel" style="
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.9);
  color: #0f0;
  padding: 10px;
  font-size: 11px;
  max-height: 200px;
  overflow-y: auto;
  z-index: 99999;
  display: none;
  font-family: monospace;
  border-top: 2px solid #f00;
"></div>

<script>
// تفعيل الفحص
(function() {
  const debug = document.getElementById('debug-panel');
  const errors = [];
  
  // اعتراض console.log و console.error
  const oldLog = console.log;
  const oldError = console.error;
  
  console.log = function(msg) {
    errors.push('📝 ' + msg);
    debug.innerHTML = errors.join('<br>');
    debug.style.display = 'block';
    oldLog.apply(console, arguments);
  };
  
  console.error = function(msg) {
    errors.push('❌ <span style="color:#f00">' + msg + '</span>');
    debug.innerHTML = errors.join('<br>');
    debug.style.display = 'block';
    oldError.apply(console, arguments);
  };
  
  // إظهار/إخفاء بالنقر المزدوج
  let tapCount = 0;
  document.addEventListener('touchstart', function(e) {
    if (e.target.tagName !== 'BUTTON' && e.target.tagName !== 'A') {
      tapCount++;
      if (tapCount === 2) {
        setTimeout(() => {
          debug.style.display = debug.style.display === 'none' ? 'block' : 'none';
        }, 300);
      }
      setTimeout(() => tapCount = 0, 500);
    }
  });
  
  console.log('✅ نظام الفحص مُفعّل - انقر مرتين لرؤية الأخطاء');
})();
</script>
  <script>
  window.onerror = function(msg, url, lineNo, columnNo, error) {
    var string = msg.toLowerCase();
    var message = [
      'Message: ' + msg,
      'URL: ' + url,
      'Line: ' + lineNo,
      'Column: ' + columnNo,
      'Error object: ' + JSON.stringify(error)
    ].join(' - ');
    
    alert("🚨 وجدنا الخطأ! يرجى نسخ هذا النص وإرساله لي:\n\n" + message);
    return false;
  };
</script>
